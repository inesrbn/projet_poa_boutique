spring.application.name=user-service

# Port : la variable PORT si elle existe, sinon 3001
server.port=${PORT:3001}

# Base H2 dans un fichier (data/users.mv.db) ; Docker donnera un autre chemin avec DB_PATH
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/users}

# Hibernate crée et met à jour les tables à partir des classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Secret des jetons
jwt.secret=${JWT_SECRET}